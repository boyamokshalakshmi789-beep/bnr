```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="forgot-password.css">
</head>

<body>

    <div class="forgot-card">

        <h2>Forgot Password</h2>

        <p class="subtitle">
            Reset your password
        </p>


        <!-- Username -->

        <div class="input-group">

            <input type="text" id="username" required>

            <label>Username</label>

        </div>


        <!-- Mobile Number -->

        <div class="input-group">

            <input type="tel" id="mobile" maxlength="10" inputmode="numeric" required>

            <label>Mobile Number</label>

        </div>


        <!-- Send OTP -->

        <button type="button" class="otp-btn" onclick="sendOTP()">

            Send OTP

        </button>


        <!-- OTP Section -->

        <div id="otpSection" class="otp-section">

            <div class="input-group">

                <input type="text" id="otp" maxlength="6" inputmode="numeric">

                <label>Enter OTP</label>

            </div>


            <!-- Submit -->

            <button type="button" class="submit-btn" onclick="submitOTP()">

                Submit

            </button>

        </div>


        <!-- Back to Login -->

        <div class="back-login">

            <a href="login.html">
                ← Back to Login
            </a>

        </div>

    </div>


    <script src="forgot-password.js"></script>

</body>

</html>
```
